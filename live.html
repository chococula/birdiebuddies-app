<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BirdieBro Live Leaderboard</title>
  <meta name="theme-color" content="#0c5b3a">
  <style>
    :root {
      --green: #0c5b3a; --green-dark: #08422a; --board: #ffffff; --paper: #f4f2ea;
      --ink: #1b1b1b; --muted: #6b6b6b; --line: #d9d6cc; --under: #c8102e; --over: #0c5b3a;
      --cur: #fff6d6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink);
      font: 15px/1.35 Georgia, "Times New Roman", serif; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    header { background: var(--green); color: #fff; border-radius: 10px 10px 0 0; padding: 14px 18px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 26px; letter-spacing: 3px; font-weight: 700; }
    header .sub { opacity: .85; font-size: 14px; font-family: -apple-system, system-ui, sans-serif; }
    .live { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 700 12px -apple-system, system-ui, sans-serif;
      letter-spacing: 1.5px; background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 999px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff3b3b; animation: pulse 1.4s infinite; }
    .dot.off { background: #999; animation: none; }
    @keyframes pulse { 0%{opacity:1} 50%{opacity:.25} 100%{opacity:1} }
    .card { background: var(--board); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; overflow: hidden; }
    table { border-collapse: collapse; width: 100%; }
    th { background: var(--green-dark); color: #fff; font: 700 11px -apple-system, system-ui, sans-serif; letter-spacing: 1.2px;
      padding: 9px 8px; text-align: center; white-space: nowrap; }
    td { border-top: 1px solid var(--line); padding: 9px 8px; text-align: center; white-space: nowrap; }
    .board td { font-size: 20px; }
    .board td.name { text-align: left; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
    .board th.name { text-align: left; }
    .board td.pos { font-weight: 700; width: 64px; }
    .board td.topar { font-weight: 700; font-size: 26px; width: 110px; }
    .board td.small { font-size: 16px; color: var(--muted); font-family: -apple-system, system-ui, sans-serif; }
    .under { color: var(--under); } .over { color: var(--over); } .even { color: var(--ink); }
    tr.moved td { animation: flash 2.5s; }
    @keyframes flash { from { background: #fff1b8; } to { background: transparent; } }
    h2 { font: 700 13px -apple-system, system-ui, sans-serif; letter-spacing: 2px; color: var(--green); margin: 22px 0 8px; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--board); border: 1px solid var(--line); border-radius: 10px; }
    .sc th, .sc td { padding: 6px 0; min-width: 34px; font-family: -apple-system, system-ui, sans-serif; }
    .sc td { font-size: 14px; font-weight: 700; }
    .sc .label { text-align: left; padding-left: 12px; min-width: 120px; position: sticky; left: 0; background: inherit; }
    .sc tr { background: #fff; }
    .sc tr.par td, .sc tr.hcp td { color: var(--muted); background: #faf9f4; }
    .sc tr.hcp td { font-size: 11px; font-weight: 500; }
    .sc .sum { background: #f0eee5; }
    .sc td.curcol { background: var(--cur) !important; }
    .sc th.curcol { background: #f2c94c !important; color: var(--green-dark); }
    .mark { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; line-height: 1; }
    .m-b { border: 1.5px solid currentColor; border-radius: 50%; }
    .m-e { border: 1.5px solid currentColor; border-radius: 50%; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px currentColor; }
    .m-bo { border: 1.5px solid currentColor; }
    .m-d { border: 1.5px solid currentColor; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px currentColor; }
    .pts { font-size: 9px; color: #0074cc; vertical-align: top; margin-left: 1px; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; color: var(--muted);
      font: 12px -apple-system, system-ui, sans-serif; align-items: center; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .msg { padding: 40px 16px; text-align: center; color: var(--muted); font-family: -apple-system, system-ui, sans-serif; }
    footer { margin-top: 18px; color: var(--muted); font: 12px -apple-system, system-ui, sans-serif; text-align: center; }
    footer a { color: var(--green); }
    @media (max-width: 600px) {
      header h1 { font-size: 20px; letter-spacing: 2px; }
      .board td { font-size: 16px; padding: 8px 6px; }
      .board td.topar { font-size: 20px; width: 70px; }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LEADERS</h1>
    <div class="sub" id="sub">Loading…</div>
    <div class="live"><span class="dot off" id="dot"></span><span id="liveText">CONNECTING</span></div>
  </header>
  <div class="card">
    <table class="board">
      <thead><tr id="boardHead"></tr></thead>
      <tbody id="board"><tr><td class="msg" colspan="6">Loading the round…</td></tr></tbody>
    </table>
  </div>

  <h2>SCORECARD</h2>
  <div class="scroll"><table class="sc" id="card"></table></div>
  <div class="legend">
    <span><span class="mark m-e under">2</span>Eagle or better</span>
    <span><span class="mark m-b under">3</span>Birdie</span>
    <span><span class="mark">4</span>Par</span>
    <span><span class="mark m-bo">5</span>Bogey</span>
    <span><span class="mark m-d">6</span>Double bogey +</span>
  </div>
  <footer>Updates live as players enter scores · <span id="updated"></span><br>
    <a href="https://chococula.github.io/birdiebuddies-app/">BirdieBro</a></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
  // Read-only live view of a shared round: rooms/CODE (same data the app writes).
  firebase.initializeApp({
    apiKey: 'AIzaSyAsUysaXZT8ULihIgqqZ7jQz1MePxq94u4',
    authDomain: 'birdiebuddies-chococula.firebaseapp.com',
    databaseURL: 'https://birdiebuddies-chococula-default-rtdb.firebaseio.com',
    projectId: 'birdiebuddies-chococula',
    appId: '1:376908649955:web:6c557a508c90a170293cd6'
  });

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const code = (new URLSearchParams(location.search).get('game') || '').trim().toUpperCase();
  const at = (node, k) => node == null ? undefined : node[k];
  let lastOrder = [];

  function toPar(d) { return d === 0 ? 'E' : (d > 0 ? '+' + d : String(d)); }
  function cls(d) { return d < 0 ? 'under' : (d > 0 ? 'over' : 'even'); }
  function mark(score, par, pts) {
    if (!score) return '';
    const d = score - par;
    const shape = d <= -2 ? 'm-e' : d === -1 ? 'm-b' : d === 1 ? 'm-bo' : d >= 2 ? 'm-d' : '';
    const color = d < 0 ? 'under' : '';
    return `<span class="mark ${shape} ${color}">${score}</span>${pts > 0 ? `<span class="pts">+${pts}</span>` : ''}`;
  }

  function render(v) {
    if (!v || !v.meta) {
      $('sub').textContent = code ? `No round found for code ${code}` : 'Add ?game=CODE to the address';
      $('board').innerHTML = `<tr><td class="msg" colspan="6">${code ? 'This round has not started or has ended.' : 'Open this page from “Live leaderboard” in BirdieBro.'}</td></tr>`;
      $('card').innerHTML = '';
      return;
    }
    const m = v.meta;
    const players = JSON.parse(m.players || '[]');
    const hcps = JSON.parse(m.handicaps || '[]');
    const holesJson = JSON.parse(m.courseHoles || '{}');
    const stroke = m.gameType !== 'sticks';
    const hole = h => holesJson[h] || { par: 4, handicapIndex: h };
    const score = (h, p) => Number(at(at(at(v.holes, h), 's'), p)) || 0;
    const pts = (h, p) => Number(at(at(at(v.holes, h), 'pts'), p)) || 0;

    // Strokes received by handicap index; net counts only holes played.
    const recv = (p, h) => { const c = hcps[p] || 0; return c <= 0 ? 0 : Math.floor(c / 18) + (hole(h).handicapIndex <= c % 18 ? 1 : 0); };
    const rows = players.map((name, p) => {
      let strokes = 0, par = 0, thru = 0, net = 0, points = 0, last = 0;
      for (let h = 1; h <= 18; h++) {
        const s = score(h, p);
        points += pts(h, p);
        if (s > 0) { strokes += s; par += hole(h).par; net += s - recv(p, h); thru++; last = h; }
      }
      return { name, p, strokes, toPar: strokes - par, netToPar: net - par, thru, net, points, last };
    });
    // Ranked on net to par (not total strokes) so players who have played more holes
    // aren't pushed down; gross to par breaks ties.
    rows.sort(stroke ? (a, b) => (a.thru === 0) - (b.thru === 0) || a.netToPar - b.netToPar || a.toPar - b.toPar
                     : (a, b) => b.points - a.points);
    const key = r => stroke ? r.netToPar : -r.points;
    const anyHcp = hcps.some(x => x > 0);
    const current = Math.max(0, ...rows.map(r => r.last));

    $('sub').textContent = `${m.courseName || m.title || 'Golf round'} · ${stroke ? 'Stroke play' : 'Volvik game'} · Game ${code}`;
    // With handicaps the board is ranked on net, so the big number is net to par.
    const netBoard = stroke && anyHcp;
    $('boardHead').innerHTML = `<th>POS</th><th class="name">PLAYER</th><th>${!stroke ? 'PTS' : netBoard ? 'NET' : 'TO PAR'}</th>` +
      (netBoard ? '<th class="hide-sm">GROSS</th>' : '') + '<th>THRU</th><th class="hide-sm">TOTAL</th>';
    $('board').innerHTML = rows.map((r, i) => {
      const first = rows.findIndex(x => key(x) === key(r));
      const tied = rows.filter(x => key(x) === key(r)).length > 1;
      const moved = lastOrder.length && lastOrder.indexOf(r.name) !== i ? 'moved' : '';
      const shown = netBoard ? r.netToPar : r.toPar;
      const main = stroke ? `<td class="topar ${cls(shown)}">${r.thru ? toPar(shown) : '–'}</td>` +
                            (netBoard ? `<td class="small hide-sm ${cls(r.toPar)}">${r.thru ? toPar(r.toPar) : '–'}</td>` : '')
                          : `<td class="topar">${r.points}</td>`;
      return `<tr class="${moved}"><td class="pos">${tied ? 'T' : ''}${first + 1}</td><td class="name">${esc(r.name)}</td>${main}` +
        `<td class="small">${r.thru === 18 ? 'F' : r.thru || '–'}</td>` +
        `<td class="small hide-sm">${r.thru ? r.strokes : '–'}</td></tr>`;
    }).join('');
    lastOrder = rows.map(r => r.name);

    const front = [1,2,3,4,5,6,7,8,9], back = [10,11,12,13,14,15,16,17,18];
    const sum = (hs, f) => hs.reduce((a, h) => a + f(h), 0);
    const cc = h => h === current ? ' curcol' : '';
    const head = '<tr><th class="label">HOLE</th>' + front.map(h => `<th class="${cc(h)}">${h}</th>`).join('') + '<th>OUT</th>' +
      back.map(h => `<th class="${cc(h)}">${h}</th>`).join('') + '<th>IN</th><th>TOT</th></tr>';
    const parRow = '<tr class="par"><td class="label">PAR</td>' + front.map(h => `<td>${hole(h).par}</td>`).join('') +
      `<td class="sum">${sum(front, h => hole(h).par)}</td>` + back.map(h => `<td>${hole(h).par}</td>`).join('') +
      `<td class="sum">${sum(back, h => hole(h).par)}</td><td class="sum">${sum([...front, ...back], h => hole(h).par)}</td></tr>`;
    const hcpRow = '<tr class="hcp"><td class="label">HCP</td>' + front.map(h => `<td>${hole(h).handicapIndex}</td>`).join('') +
      '<td class="sum"></td>' + back.map(h => `<td>${hole(h).handicapIndex}</td>`).join('') + '<td class="sum"></td><td class="sum"></td></tr>';
    const playerRows = rows.map(r => {
      const cell = h => `<td class="${cc(h).trim()}">${mark(score(h, r.p), hole(h).par, stroke ? 0 : pts(h, r.p))}</td>`;
      const tot = hs => { const t = sum(hs, h => score(h, r.p)); return t || ''; };
      return `<tr><td class="label">${esc(r.name).toUpperCase()}</td>${front.map(cell).join('')}<td class="sum">${tot(front)}</td>` +
        `${back.map(cell).join('')}<td class="sum">${tot(back)}</td><td class="sum">${tot([...front, ...back])}</td></tr>`;
    }).join('');
    $('card').innerHTML = head + parRow + hcpRow + playerRows;
    $('updated').textContent = 'Last update ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }

  if (!code) {
    render(null);
  } else {
    const db = firebase.database();
    db.ref('.info/connected').on('value', s => {
      const on = s.val() === true;
      $('dot').classList.toggle('off', !on);
      $('liveText').textContent = on ? 'LIVE' : 'RECONNECTING';
    });
    db.ref('rooms/' + code).on('value', s => render(s.val()), () => render(null));
  }
</script>
</body>
</html>
